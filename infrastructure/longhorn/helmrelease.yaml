apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.7.*"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  values:
    persistence:
      defaultClassReplicaCount: 1
    defaultSettings:
      defaultReplicaCount: 1
    service:
      ui:
        type: LoadBalancer
    longhornUI:
      replicas: 1
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: longhorn-frontend
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: longhorn-frontend
                annotations:
                  io.cilium/lb-ipam-ips: "192.168.1.192"
