apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-diskstation-talos
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-diskstation
  mountOptions:
    - nfsvers=3
    - tcp
    - resvport
  nfs:
    server: ds.basilar.local
    path: /volume1/talos.nfs
---
# Litestream replica target for met-to-wg. Lives under a dedicated subpath
# so it doesn't collide with other NFS consumers (e.g. jellyfin-media,
# which binds the wider nfs-diskstation-talos PV above).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-diskstation-met-to-wg
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-diskstation
  mountOptions:
    - nfsvers=3
    - tcp
    - resvport
  nfs:
    server: ds.basilar.local
    path: /volume1/talos.nfs/met-to-wg
---
# Audiobook library served by podspine. Dedicated subpath so podspine sees
# only books (jellyfin also sees it via the wider nfs-diskstation-talos PV).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-diskstation-audio-books
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-diskstation
  mountOptions:
    - nfsvers=3
    - tcp
    - resvport
  nfs:
    server: ds.basilar.local
    path: /volume1/talos.nfs/audio-books
---
# Transmission's view of the share root. A second PV on the same export
# (jellyfin's PV is already bound); the deployment mounts only the
# `downloads` subPath, which kubelet creates on first mount, so finished
# downloads appear to jellyfin at /media/downloads.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-diskstation-transmission
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-diskstation
  mountOptions:
    - nfsvers=3
    - tcp
    - resvport
  nfs:
    server: ds.basilar.local
    path: /volume1/talos.nfs
