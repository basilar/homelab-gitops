apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Probe CR is created separately; chart-managed ServiceMonitor not needed.
    serviceMonitor:
      enabled: false
    # *.basilar.local resolves only on the home LAN; map them to the Traefik
    # LB IP so the probe pod can reach them in-cluster.
    hostAliases:
      - ip: 192.168.1.192
        hostnames:
          - prometheus.basilar.local
          - grafana.basilar.local
          - alertmanager.basilar.local
          - longhorn.basilar.local
          - yayog.basilar.local
    config:
      modules:
        # http_2xx with insecure_skip_verify because endpoints use the internal
        # basilar-ca self-signed cert. Cert expiry is tracked separately via
        # cert-manager_certificate_expiration_timestamp_seconds.
        http_2xx_basilar:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200, 401]
            tls_config:
              insecure_skip_verify: true
