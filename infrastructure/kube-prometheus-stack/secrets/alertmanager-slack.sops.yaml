# /etc/alertmanager/secrets/alertmanager-slack/webhook-url and read via
# global.slack_api_url_file, so the URL reaches Alertmanager without ever
# appearing in git or in the rendered Helm values. The key name is the
# mounted filename -- renaming it breaks that path.
