apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-tls
  namespace: monitoring
spec:
  secretName: monitoring-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: basilar-ca
    kind: ClusterIssuer
  dnsNames:
    - prometheus.basilar.local
    - grafana.basilar.local
    - alertmanager.basilar.local
