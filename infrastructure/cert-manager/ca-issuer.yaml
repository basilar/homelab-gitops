apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: basilar-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: basilar-ca
  secretName: basilar-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: basilar-ca
spec:
  ca:
    secretName: basilar-ca
