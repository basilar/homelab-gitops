# Guest credentials for the SMB share //ls.basilar.local/media (Buffalo
# LinkStation). csi-driver-smb always passes username=/password= to
# mount.cifs, so guest access is expressed as username "guest" with an
# empty password -- the same session the macOS client negotiates
# (//GUEST:@ls.basilar.local/media).
#
# These values are not sensitive today, but they are kept SOPS-encrypted so
# that swapping in a real account later is an edit, not a re-plumbing.
