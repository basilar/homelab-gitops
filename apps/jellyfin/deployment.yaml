apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: jellyfin
          # 12.0 (released 2026-09-08). Upgraded direct from 10.10.7, which is
          # the minimum version the 12.0 notes support for a direct jump.
          # The migration rewrites the database and CANNOT be rolled back
          # without restoring /config -- pre-upgrade safety nets are the
          # Longhorn snapshot `jellyfin-config-pre-12-0` and
          # /media/backups/jellyfin-config-10.10.7-20260908.tar.gz.
          # A FULL LIBRARY SCAN IS REQUIRED after upgrading: auto-resolved
          # alternate versions are dropped by the migration and only a scan
          # restores them.
          image: jellyfin/jellyfin:12.0
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: false
            - name: media-smb
              mountPath: /media-smb
              readOnly: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: media-smb
          persistentVolumeClaim:
            claimName: jellyfin-media-smb
