apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
          env:
            - name: PUID
              value: "1041"
            - name: PGID
              value: "100"
            # Trust X-Forwarded-For from the pod network (Traefik). Without
            # it Prowlarr treats every proxied request as an unknown client,
            # so "auth disabled for local addresses" never applies.
            - name: PROWLARR__SERVER__TRUSTEDNETWORKS
              value: 10.244.0.0/16
          ports:
            - name: http
              containerPort: 9696
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
