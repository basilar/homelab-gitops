apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre
  namespace: calibre
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`calibre.basilar.local`)
      kind: Rule
      services:
        - name: calibre
          port: 8083
  tls:
    secretName: calibre-tls
