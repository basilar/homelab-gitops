apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transmission
  namespace: transmission
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`transmission.basilar.local`)
      kind: Rule
      services:
        - name: transmission
          port: 9091
  tls:
    secretName: transmission-tls
